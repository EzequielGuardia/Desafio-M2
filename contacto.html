<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="./Components/header.css">
    <link rel="stylesheet" href="./Components/footer.css">
    <link rel="stylesheet" href="./Pages/contacto.css">

    <script defer src="./Components/header.js"></script>
    <script defer src="./Components/footer.js"></script>
    <script defer src="./Pages/contacto.js"></script>


</head>
<body>
        <nav class="navegador">
        </nav>

    <form id="formulario">

    <h2 class="main-title">Contáctame</h2>

    <section class="caja-form">
        <div class="inputs-superiores">
        <div class="field">
                <label class="label">Name</label>
                <div class="control">
                    <input class="input" type="text" placeholder="e.g Alex Smith">
                </div>
            </div>

            <div class="field">
            <label class="label">Email</label>
            <div class="control">
                <input class="input" type="email" placeholder="e.g. alexsmith@gmail.com">
            </div>
            </div>
        </div>
                <div class="field">
            <label class="label">Message</label>
            <div class="control">
                <textarea class="textarea" placeholder="Textarea"></textarea>
            </div>
            </div>

            <div class="field is-grouped">
            <div class="control">
                <button class="button is-link">Submit</button>
            </div>
            <div class="control">
                <button class="button is-link is-light">Cancel</button>
            </div>
                </div>
    </section>
</form>

    <div class="footer-js">
    </div>
</body>
</html>
